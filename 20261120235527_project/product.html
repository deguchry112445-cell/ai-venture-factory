    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完全版】個人美容室専用 薬剤使用量＆廃棄ロス自動算出ビルダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- ブックマーク警告バー -->
    <div class="bg-amber-500 text-slate-900 py-3 px-6 text-center text-xs md:text-sm font-bold shadow-md sticky top-0 z-50 flex flex-col sm:flex-row justify-center items-center gap-3">
        <span>【重要】次回以降もこの完全版を利用するため、必ずこのページをブックマークするか専用URLをコピーして保管してください</span>
        <button id="copyUrlBtn" class="bg-slate-900 text-white hover:bg-slate-800 px-3 py-1.5 rounded-lg text-xs transition">
            <i class="fa-solid fa-copy mr-1"></i> 現在の専用URLをコピー
        </button>
    </div>

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 py-4 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded">完全版</span>
                <h1 class="text-base md:text-lg font-black text-slate-800">薬剤使用量＆廃棄ロス自動算出ビルダー</h1>
            </div>
            <span class="text-xs font-bold text-slate-500">Venture Factory</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">

        <!-- 入力フォームカード -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8 mb-10">
            <h2 class="text-lg font-black mb-6 text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-calculator text-indigo-600"></i> 新規計算・記録登録
            </h2>
            <form id="calcForm" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">顧客名 / カルテNo</label>
                    <input type="text" id="clientName" required placeholder="例: 山田様" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">レングス（髪の長さ）</label>
                    <select id="lengthType" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="short">ショート（標準: 60g）</option>
                        <option value="medium" selected>ミディアム（標準: 90g）</option>
                        <option value="long">ロング（標準: 120g）</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">施術メニュー</label>
                    <select id="menuType" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="entire" selected>全体カラー</option>
                        <option value="retouch">リタッチ（根元2cm）</option>
                        <option value="perm">パーマ＆カラー</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">薬剤ブランド</label>
                    <select id="brandType" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="standard" selected>スタンダード（原価: 15円/g）</option>
                        <option value="organic">オーガニック（原価: 25円/g）</option>
                        <option value="premium">プレミアム（原価: 35円/g）</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">希釈倍率（1剤対比の2剤）</label>
                    <select id="dilution" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="1" selected>1 : 1（等倍）</option>
                        <option value="1.5">1 : 1.5</option>
                        <option value="2">1 : 2</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-lg transition shadow-md">
                        <i class="fa-solid fa-plus mr-1"></i> 計算して履歴に追加
                    </button>
                </div>
            </form>
        </div>

        <!-- 一覧・CSV出力セクション -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-100 gap-4">
                <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> 算出・保存データ一覧
                </h3>
                <div class="flex items-center gap-3">
                    <button id="exportCsvBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-lg transition shadow">
                        <i class="fa-solid fa-file-csv mr-1"></i> CSV出力（UTF-8 BOM）
                    </button>
                    <button id="clearAllBtn" class="bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold text-xs px-4 py-2.5 rounded-lg transition">
                        履歴を全削除
                    </button>
                </div>
            </div>

            <!-- テーブル -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                            <th class="p-3 rounded-l-lg">日時</th>
                            <th class="p-3">顧客名</th>
                            <th class="p-3">レングス / メニュー</th>
                            <th class="p-3">1剤使用量</th>
                            <th class="p-3">2剤使用量</th>
                            <th class="p-3">総原価</th>
                            <th class="p-3 text-center rounded-r-lg">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="text-sm divide-y divide-slate-100">
                        <!-- 動的挿入 -->
                    </tbody>
                </table>
                <div id="emptyState" class="text-center py-12 text-slate-400">
                    <i class="fa-solid fa-folder-open text-3xl mb-3 block"></i>
                    保存されたデータはありません。上のフォームから計算を行ってください。
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-slate-900 text-slate-400 py-10 px-6 text-center text-xs mt-20">
        <div class="max-w-4xl mx-auto space-y-4">
            <p>&copy; 2026 Venture Factory. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // URLコピー機能
        document.getElementById('copyUrlBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('現在の専用URLをコピーしました！ブックマークと併せて保存してください。');
            }).catch(err => {
                alert('コピーに失敗しました。ブラウザのアドレスバーからコピーしてください。');
            });
        });

        // データ管理ロジック (localStorage)
        let records = JSON.parse(localStorage.getItem('vf_hair_records') || '[]');

        const calcForm = document.getElementById('calcForm');
        const recordTableBody = document.getElementById('recordTableBody');
        const emptyState = document.getElementById('emptyState');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        function renderTable() {
            recordTableBody.innerHTML = '';
            if (records.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            records.forEach((rec, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-3 text-xs text-slate-500">${rec.date}</td>
                    <td class="p-3 font-bold text-slate-800">${rec.clientName}</td>
                    <td class="p-3 text-slate-600">${rec.lengthLabel} / ${rec.menuLabel}</td>
                    <td class="p-3 font-semibold text-slate-900">${rec.agent1}g</td>
                    <td class="p-3 text-slate-600">${rec.agent2}g</td>
                    <td class="p-3 font-bold text-amber-600">¥${rec.totalCost.toLocaleString()}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteRecord(${index})" class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1 rounded transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                recordTableBody.appendChild(tr);
            });
        }

        calcForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const clientName = document.getElementById('clientName').value;
            const lengthType = document.getElementById('lengthType').value;
            const menuType = document.getElementById('menuType').value;
            const brandType = document.getElementById('brandType').value;
            const dilution = parseFloat(document.getElementById('dilution').value);

            // คคำさんロジック
            let baseGram = 90;
            let lengthLabel = 'ミディアム';
            if (lengthType === 'short') { baseGram = 60; lengthLabel = 'ショート'; }
            if (lengthType === 'long') { baseGram = 120; lengthLabel = 'ロング'; }

            let multiplier = 1.0;
            let menuLabel = '全体カラー';
            if (menuType === 'retouch') { multiplier = 0.5; menuLabel = 'リタッチ'; }
            if (menuType === 'perm') { multiplier = 1.3; menuLabel = 'パーマ＆カラー'; }

            let unitPrice = 15;
            if (brandType === 'organic') unitPrice = 25;
            if (brandType === 'premium') unitPrice = 35;

            const agent1 = Math.round(baseGram * multiplier);
            const agent2 = Math.round(agent1 * dilution);
            const totalCost = (agent1 + agent2) * unitPrice;

            const now = new Date();
            const dateStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newRecord = {
                date: dateStr,
                clientName,
                lengthLabel,
                menuLabel,
                agent1,
                agent2,
                totalCost
            };

            records.unshift(newRecord);
            localStorage.setItem('vf_hair_records', JSON.stringify(records));
            renderTable();
            calcForm.reset();
        });

        window.deleteRecord = function(index) {
            if (confirm('この記録を削除してもよろしいですか？')) {
                records.splice(index, 1);
                localStorage.setItem('vf_hair_records', JSON.stringify(records));
                renderTable();
            }
        };

        clearAllBtn.addEventListener('click', () => {
            if (confirm('すべての履歴データを削除しますか？この操作は元に戻せますン。')) {
                records = [];
                localStorage.removeItem('vf_hair_records');
                renderTable();
            }
        });

        // CSV出力（BOM付きUTF-8）
        exportCsvBtn.addEventListener('click', () => {
            if (records.length === 0) {
                alert('出力するデータがありません。');
                return;
            };

            let csv = '\uFEFF'; // BOM
            csv += '日時,顧客名,レングス,メニュー,1剤(g),2剤(g),総原価(円)\n';
            records.forEach(r => {
                csv += `"${r.date}","${r.clientName}","${r.lengthLabel}","${r.menuLabel}",${r.agent1},${r.agent2},${r.totalCost}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hair_agent_records_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        renderTable();
    </script>
</body>
</html>
