    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完全版】仕向地別コンテナ積載率・海上運賃自動最適化ビルダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
    <!-- ブックマーク注意バー -->
    <div class="bg-indigo-600 text-white text-xs py-3 px-4 text-center font-medium flex flex-col sm:flex-row justify-center items-center gap-3 shadow-md">
        <span>【重要】次回以降もこの完全版を利用するため、必ずこのページをブックマークするか専用URLをコピーして保管してください</span>
        <button onclick="copyCurrentUrl()" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-1.5 rounded text-xs transition border border-indigo-400/30 flex items-center gap-1">
            <i class="fa-solid fa-copy"></i> 現在の専用URLをコピー
        </button>
    </div>

    <!-- ヘッダー -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="bg-indigo-500/20 text-indigo-400 text-xs font-bold px-2.5 py-1 rounded border border-indigo-500/30">完全版</span>
            <h1 class="text-sm md:text-base font-bold">コンテナ積載・海上運賃最適化ビルダー</h1>
        </div>
        <div class="text-xs text-slate-400">Venture Factory</div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid lg:grid-cols-3 gap-6">
        <!-- 入力フォームエリア -->
        <div class="lg:col-span-1 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <h2 class="text-base font-bold mb-4 text-indigo-300 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> 新規積載データ登録
            </h2>
            <form id="calcForm" onsubmit="handleSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">案件管理名 / シリアル</label>
                    <input type="text" id="caseName" required placeholder="例: 3月積み Mombasa案件" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">コンテナ規格</label>
                    <select id="containerType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
                        <option value="40ft">40フィート (上限: 67.0 m³)</option>
                        <option value="20ft">20フィート (上限: 32.0 m³)</option>
                        <option value="40hc">40フィートHC (上限: 76.0 m³)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">海上運賃 (USD)</label>
                    <input type="number" id="oceanFreight" required placeholder="例: 3500" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">現地通関・付帯費用 (USD)</label>
                    <input type="number" id="localCost" required placeholder="例: 450" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">積載車両の合計体積 (m³)</label>
                    <input type="number" step="0.1" id="totalCarVolume" required placeholder="例: 42.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">積載台数</label>
                    <input type="number" id="carCount" required placeholder="例: 3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg">
                    計算して保存する
                </button>
            </form>
        </div>

        <!-- データ一覧・分析エリア -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h2 class="text-base font-bold text-slate-100">保存済み積載データ一覧</h2>
                        <p class="text-xs text-slate-400">localStorageに自動保存されています</p>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="exportCSV()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-4 rounded-lg transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-file-csv">></i> CSV出力
                        </button>
                        <button onclick="clearAllData()" class="bg-slate-700 hover:bg-red-600/50 text-slate-300 hover:text-white text-xs py-2 px-3 rounded-lg transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900 text-xs text-slate-400 uppercase border-b border-slate-700">
                            <tr>
                                <th class="p-3">案件名</th>
                                <th class="p-3">規格</th>
                                <th class="p-3">積載率</th>
                                <th class="p-3">1台当送料</th>
                                <th class="p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="divide-y divide-slate-700">
                            <!-- 動的挿入 -->
                        </tbody>
                    </table>
                    <div id="emptyState" class="text-center py-12 text-slate-500 text-sm hidden">
                        保存されたデータはありません。左側のフォームから追加してください。
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="py-6 px-6 text-center text-xs text-slate-500 border-t border-slate-800">
        <p>&copy; 2026 Venture Factory. All rights reserved.</p>
    </footer>

    <script>
        let savedData = JSON.parse(localStorage.getItem('vf_container_data')) || [];

        function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('専用URLをコピーしました。お気に入りに登録してください。');
            });
        }

        function getMaxVol(type) {
            if (type === '40ft') return 67.0;
            if (type === '20ft') return 32.0;
            if (type === '40hc') return 76.0;
            return 67.0;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const item = {
                id: Date.now(),
                caseName: document.getElementById('caseName').value,
                containerType: document.getElementById('containerType').value,
                oceanFreight: parseFloat(document.getElementById('oceanFreight').value) || 0,
                localCost: parseFloat(document.getElementById('localCost').value) || 0,
                totalCarVolume: parseFloat(document.getElementById('totalCarVolume').value) || 0,
                carCount: parseInt(document.getElementById('carCount').value) || 1
            };

            savedData.unshift(item);
            localStorage.setItem('vf_container_data', JSON.stringify(savedData));
            document.getElementById('calcForm').reset();
            renderTable();
        }

        function deleteItem(id) {
            savedData = savedData.filter(item => item.id !== id);
            localStorage.setItem('vf_container_data', JSON.stringify(savedData));
            renderTable();
        }

        function clearAllData() {
            if (confirm('すべての保存データを削除してもよろしいですか？')) {
                savedData = [];
                localStorage.removeItem('vf_container_data');
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (savedData.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            savedData.forEach(item => {
                const maxVol = getMaxVol(item.containerType);
                const loadRate = ((item.totalCarVolume / maxVol) * 100).toFixed(1);
                const totalCost = item.oceanFreight + item.localCost;
                const costPerCar = (totalCost / item.carCount).toLocaleString('en-US', {style: 'currency', currency: 'USD'});

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-200">${escapeHtml(item.caseName)}</td>
                    <td class="p-3 uppercase text-xs"><span class="bg-slate-700 px-2 py-1 rounded text-slate-300">${item.containerType}</span></td>
                    <td class="p-3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold ${loadRate > 100 ? 'text-red-400' : 'text-cyan-400'}">${loadRate}%</span>
                            <div class="w-16 bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full" style="width: ${Math.min(loadRate, 100)}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="p-3 font-bold text-indigo-300">${costPerCar}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-red-400 transition p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            if (savedData.length === 0) {
                alert('出力するデータがありません。');
                return;
            };

            let csv = '\uFEFF案件名,コンテナ規格,海上運賃(USD),現地費用(USD),合計体積(m3),積載台数,1台当送料(USD),積載率(%)\n';
            savedData.forEach(item => {
                const maxVol = getMaxVol(item.containerType);
                const loadRate = ((item.totalCarVolume / maxVol) * 100).toFixed(1);
                const totalCost = item.oceanFreight + item.localCost;
                const costPerCar = (totalCost / item.carCount).toFixed(2);
                csv += `"${item.caseName}",${item.containerType},${item.oceanFreight},${item.localCost},${item.totalCarVolume},${item.carCount},${costPerCar},${loadRate}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `container_optimization_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        renderTable();
    </script>
</body>
</html>
