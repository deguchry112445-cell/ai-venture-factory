                <i class="fa-solid fa-users-rectangle mr-1"></i> お客様同意管理ツール

        <div id="tab-template" class="space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-slate-900">【弁護士監修】ネイリストのためのSNS著作権・デザイン商用利用トラブル防止規約</h3>
                    <button onclick="copyTemplate()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg transition">

                </div>
                <textarea id="template-text" class="w-full h-80 p-4 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl leading-relaxed focus:outline-none" readonly>

                </textarea>
            </div>

        <!-- Tab 2: Manager -->
        <div id="tab-manager" class="hidden space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h3 class="font-bold text-lg text-slate-900 mb-4">お客様同意記録の新規追加</h3>
                <form id="consent-form" onsubmit="addConsent(event)" class="grid md:grid-cols-3 gap-4">

                        <label class="block text-xs font-bold text-slate-500 mb-1">お客様お名前</label>

                        <label class="block text-xs font-bold text-slate-500 mb-1">同意確認日</label>

                    <div class="flex items-end">

                </form>

            <!-- Data Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

    <script>
        // Tab Switching
        function switchTab(tab) {
            if (tab === 'template') {
                document.getElementById('tab-template').classList.remove('hidden');
                document.getElementById('tab-manager').classList.add('hidden');
                document.getElementById('btn-template').className = 'pb-3 font-bold text-sm border-b-2 border-rose-600 text-rose-600 transition';
                document.getElementById('btn-manager').className = 'pb-3 font-bold text-sm text-slate-500 hover:text-slate-800 transition';
            } else {
                document.getElementById('tab-template').classList.add('hidden');
                document.getElementById('tab-manager').classList.remove('hidden');
                document.getElementById('btn-manager').className = 'pb-3 font-bold text-sm border-b-2 border-rose-600 text-rose-600 transition';
                document.getElementById('btn-template').className = 'pb-3 font-bold text-sm text-slate-500 hover:text-slate-800 transition';
            }
        }

        // Copy Template
        function copyTemplate() {
            const text = document.getElementById('template-text');
            text.select();
            navigator.clipboard.writeText(text.value);
            alert('規約全文をクリップボードにコピーしました！');
        }

        // LocalStorage Management
        let consents = JSON.parse(localStorage.getItem('vf_nail_consents')) || [
            { id: 1, name: '佐藤 美咲', date: '2026-06-01' },
            { id: 2, name: '鈴木 恵', date: '2026-06-02' }
        ];

        function saveConsents() {
            localStorage.setItem('vf_nail_consents', JSON.stringify(consents));
            renderConsents();
        }

        function renderConsents() {
            const tbody = document.getElementById('consent-list');
            tbody.innerHTML = '';
            if (consents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400 text-xs">データがありません。</td></tr>';
                return;
            }
            consents.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-slate-50';
                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-800">${item.name} 様</td>
                    <td class="p-4 text-slate-600">${item.date}</td>
                    <td class="p-4"><span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">同意確認済</span></td>
                    <td class="p-4 text-right"><button onclick="deleteConsent(${item.id})" class="text-slate-400 hover:text-rose-600 text-xs transition"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addConsent(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const date = document.getElementById('cust-date').value;
            const newItem = { id: Date.now(), name, date };
            consents.push(newItem);
            saveConsents();
            document.getElementById('consent-form').reset();
            alert('同意データを保存しました。');
        }

        function deleteConsent(id) {
            if (confirm('このデータを削除してもよろしいですか？')) {
                consents = consents.filter(item => item.id !== id);
                saveConsents();
            }
        }

        function exportCSV() {
            let csv = '\uFEFFお客様名,同意日,ステータス\n';
            consents.forEach(item => {
                csv += `"${item.name}","${item.date}","同意確認済"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nail_salon_consents_2026.csv';
            a.click();
        }

        // Init default date today
        document.getElementById('cust-date').valueAsDate = new Date();
        renderConsents();
    </script>
</body>
