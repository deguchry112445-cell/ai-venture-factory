    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完全版】個人ボードゲームカフェ専用 貸出数・プレイ時間別延滞料自動計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <!-- ブックマーク・専用URL注意バー -->
    <div class="bg-indigo-600 text-white px-4 py-3 text-xs sm:text-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2 font-medium">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>【重要】次回以降もこの完全版を利用するため、必ずこのページをブックマークするか専用URLをコピーして保管してください</span>
            </div>
            <button id="copy-url-btn" class="px-3 py-1.5 bg-white text-indigo-600 font-bold rounded-lg shadow hover:bg-indigo-50 transition flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-copy"></i> 現在の専用URLをコピー
            </button>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="font-bold tracking-wider text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-dice"></i> ボドゲカフェ清算システム <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded">完全版</span>
            </div>
            <div class="text-xs text-slate-400">
                Venture Factory
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 入力フォームエリア -->
            <div class="lg:col-span-1 bg-slate-950 p-6 rounded-2xl border border-slate-800 h-fit">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-calculator text-indigo-400"></i> リアルタイム計算フォーム
                </h2>
                
                <form id="calc-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">お客様名 / テーブル名</label>
                        <input type="text" id="customer-name" placeholder="例: テーブルA" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">基本料金（円）</label>
                        <input type="number" id="base-fee" value="1000" min="0" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">貸出ボードゲーム数（個）</label>
                        <input type="number" id="game-count" value="2" min="0" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">超過時間（分）</label>
                        <input type="number" id="overtime" value="30" min="0" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">ゲーム加算単価 / 10分毎（円）</label>
                        <input type="number" id="rate" value="100" min="0" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="pt-4 bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-slate-400">計算結果（税込）</span>
                            <span id="live-overtime-fee" class="text-xs text-indigo-400 font-medium">延滞料: 0円</span>
                        </div>
                        <div id="live-total" class="text-2xl font-extrabold text-indigo-400">0円</div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> 履歴リストに追加
                    </button>
                </form>
            </div>

            <!-- 履歴・管理エリア -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-indigo-400"></i> 清算履歴・一覧管理
                        </h2>
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <button id="export-csv-btn" class="flex-1 sm:flex-none px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 font-medium text-xs rounded-xl transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-file-csv text-indigo-400"></i> CSVダウンロード
                            </button>
                            <button id="clear-history-btn" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-rose-400 font-medium text-xs rounded-xl transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-trash"></i> 全削除
                            </button>
                        </div>
                    </div>

                    <!-- テーブル -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                                <tr>
                                    <th class="p-3">日時</th>
                                    <th class="p-3">顧客/テーブル</th>
                                    <th class="p-3">基本料金</th>
                                    <th class="p-3">ボドゲ数</th>
                                    <th class="p-3">超過</th>
                                    <th class="p-3">延滞料</th>
                                    <th class="p-3">合計</th>
                                    <th class="p-3 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody" class="divide-y divide-slate-800/60">
                                <!-- 動的挿入 -->
                            </tbody>
                        </table>
                        <div id="empty-notice" class="py-12 text-center text-slate-500 text-xs hidden">
                            履歴データはありません。左側のフォームから追加してください。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-slate-950 border-t border-slate-800 py-8 text-center text-xs text-slate-500 mt-20">
        <p>&copy; 2026 Venture Factory. All rights reserved.</p>
    </footer>

    <script>
        // 独立した純粋関数による計算ロジック
        function calculateFee(baseFee, gameCount, overtimeMinutes, ratePer10Mins) {
            const b = Math.max(0, Number(baseFee) || 0);
            const g = Math.max(0, Number(gameCount) || 0);
            const o = Math.max(0, Number(overtimeMinutes) || 0);
            const r = Math.max(0, Number(ratePer10Mins) || 0);

            const units = Math.ceil(o / 10);
            const overtimeFee = units * r * (g === 0 ? 1 : g);
            const total = b + overtimeFee;
            return {
                overtimeFee,
                total
            };
        }

        // DOM要素
        const copyUrlBtn = document.getElementById('copy-url-btn');
        const calcForm = document.getElementById('calc-form');
        const customerNameInput = document.getElementById('customer-name');
        const baseFeeInput = document.getElementById('base-fee');
        const gameCountInput = document.getElementById('game-count');
        const overtimeInput = document.getElementById('overtime');
        const rateInput = document.getElementById('rate');
        const liveTotal = document.getElementById('live-total');
        const liveOvertimeFee = document.getElementById('live-overtime-fee');
        const historyTbody = document.getElementById('history-tbody');
        const emptyNotice = document.getElementById('empty-notice');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        // URLコピー機能
        copyUrlBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const originalText = copyUrlBtn.innerHTML;
                copyUrlBtn.innerHTML = '<i class="fa-solid fa-check"></i> コピーしました！';
                setTimeout(() => {
                    copyUrlBtn.innerHTML = originalText;
                }, 2000);
            });
        });

        // リアルタイム計算更新
        function updateLiveCalc() {
            const res = calculateFee(
                baseFeeInput.value,
                gameCountInput.value,
                overtimeInput.value,
                rateInput.value
            );
            liveTotal.textContent = res.total.toLocaleString() + '円';
            liveOvertimeFee.textContent = `延滞料: ${res.overtimeFee.toLocaleString()}円`;
        }

        [baseFeeInput, gameCountInput, overtimeInput, rateInput].forEach(input => {
            input.addEventListener('input', updateLiveCalc);
        });

        // LocalStorage 管理
        let historyData = JSON.parse(localStorage.getItem('vf_boc_history') || '[]');

        function saveHistory() {
            localStorage.setItem('vf_boc_history', JSON.stringify(historyData));
            renderHistory();
        }

        function renderHistory() {
            historyTbody.innerHTML = '';
            if (historyData.length === 0) {
                emptyNotice.classList.remove('hidden');
                return;
            }
            emptyNotice.classList.add('hidden');

            historyData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-900/50 transition';

                const tdDate = document.createElement('td');
                tdDate.className = 'p-3 text-slate-400';
                tdDate.textContent = item.date;

                const tdName = document.createElement('td');
                tdName.className = 'p-3 font-medium text-slate-200';
                tdName.textContent = item.customerName;

                const tdBase = document.createElement('td');
                tdBase.className = 'p-3 text-slate-300';
                tdBase.textContent = Number(item.baseFee).toLocaleString() + '円';

                const tdGame = document.createElement('td');
                tdGame.className = 'p-3 text-slate-300';
                tdGame.textContent = item.gameCount + '個';

                const tdOver = document.createElement('td');
                tdOver.className = 'p-3 text-slate-300';
                tdOver.textContent = item.overtime + '分';

                const tdOverFee = document.createElement('td');
                tdOverFee.className = 'p-3 text-slate-300';
                tdOverFee.textContent = Number(item.overtimeFee).toLocaleString() + '円';

                const tdTotal = document.createElement('td');
                tdTotal.className = 'p-3 font-bold text-indigo-400';
                tdTotal.textContent = Number(item.total).toLocaleString() + '円';

                const tdAction = document.createElement('td');
                tdAction.className = 'p-3 text-right';
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-slate-500 hover:text-rose-400 transition p-1';
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                deleteBtn.addEventListener('click', () => {
                    historyData.splice(index, 1);
                    saveHistory();
                });
                tdAction.appendChild(deleteBtn);

                tr.appendChild(tdDate);
                tr.appendChild(tdName);
                tr.appendChild(tdBase);
                tr.appendChild(tdGame);
                tr.appendChild(tdOver);
                tr.appendChild(tdOverFee);
                tr.appendChild(tdTotal);
                tr.appendChild(tdAction);

                historyTbody.appendChild(tr);
            });
        }

        calcForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const res = calculateFee(
                baseFeeInput.value,
                gameCountInput.value,
                overtimeInput.value,
                rateInput.value
            );

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newItem = {
                date: dateStr,
                customerName: customerNameInput.value,
                baseFee: Number(baseFeeInput.value),
                gameCount: Number(gameCountInput.value),
                overtime: Number(overtimeInput.value),
                overtimeFee: res.overtimeFee,
                total: res.total
            };

            historyData.unshift(newItem);
            saveHistory();
            customerNameInput.value = '';
            customerNameInput.focus();
        });

        clearHistoryBtn.addEventListener('click', () => {
            if (confirm('清算履歴をすべて削除してもよろしいですか？')) {
                historyData = [];
                saveHistory();
            }
        });

        // 文字化け防止BOM付きUTF-8 CSVダウンロード
        exportCsvBtn.addEventListener('click', () => {
            if (historyData.length === 0) {
                alert('エクスポートする履歴データがありません。');
                return;
            }

            const headers = ['日時', '顧客/テーブル', '基本料金', 'ボードゲーム数', '超過時間(分)', '延滞料', '合計金額'];
            const rows = historyData.map(item => [
                `"${item.date}"`,
                `"${item.customerName}"`,
                item.baseFee,
                item.gameCount,
                item.overtime,
                item.overtimeFee,
                item.total
            ]);

            const csvContent = [headers.join(','), ...rows.map(e => e.join(','))].join('\r\n');
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `boc_seisan_history_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        updateLiveCalc();
        renderHistory();
    </script>
</body>
</html>
