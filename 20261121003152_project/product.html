    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完全版】キッチンカー専用 食材廃棄ロス・原価変動自動最適化ビルダー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <!-- 重要告知バー -->
    <div class="bg-amber-500 text-white px-4 py-3 text-xs md:text-sm text-center font-medium">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-2">
            <span>【重要】次回以降もこの完全版を利用するため、必ずこのページをブックマークするか専用URLをコピーして保管してください。</span>
            <button onclick="copyCurrentUrl()" class="bg-white text-amber-900 font-bold px-3 py-1 rounded shadow-sm hover:bg-amber-100 transition">
                <i class="fa-solid fa-copy mr-1"></i> 現在の専用URLをコピー
            </button>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-orange-500 text-white text-xs font-bold px-2.5 py-1 rounded-md">完全版</span>
                <h1 class="font-bold text-sm md:text-base text-slate-800">原価・ロス自動最適化ビルダー</h1>
            </div>
            <span class="text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full">Venture Factory</span>
        </div>
    </header>

    <!-- メインアプリ領域 -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
        <!-- 入力フォームカード -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="font-bold text-lg mb-4 text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-orange-500"></i> 出店条件・食材データの入力
            </h2>
            <form id="calcForm" onsubmit="handleSubmit(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">出店日・識別名</label>
                    <input type="text" id="inputDate" required placeholder="例: 4/15 渋谷公園前" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">予想来客数（人）</label>
                    <input type="number" id="inputVisitors" required min="1" value="100" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">天候係数</label>
                    <select id="inputWeather" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                        <option value="1.0">晴れ (1.0)</option>
                        <option value="0.8">曇り (0.8)</option>
                        <option value="0.6">雨天 (0.6)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">平均単価（円）</label>
                    <input type="number" id="inputPrice" required min="1" value="800" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div class="md:col-span-4 flex justify-end gap-3 mt-2">
                    <button type="button" onclick="loadSampleData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition">
                        サンプル値を埋める
                    </button>
                    <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition shadow">
                        <i class="fa-solid fa-calculator mr-1"></i> 計算して保存する
                    </button>
                </div>
            </form>
        </div>

        <!-- 履歴・一覧管理テーブル -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-orange-500"></i> 最適化計算履歴・一覧
                </h2>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="exportCSV()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow">
                        <i class="fa-solid fa-download mr-1"></i> CSV出力 (BOM付UTF-8)
                    </button>
                    <button onclick="clearData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-4 py-2.5 rounded-xl transition">
                        全削除
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-xs uppercase font-bold text-slate-700">
                        <tr>
                            <th class="p-3 rounded-l-lg">出店日・名称</th>
                            <th class="p-3">来客数</th>
                            <th class="p-3">天候係数</th>
                            <th class="p-3">予測売上</th>
                            <th class="p-3">推奨仕入予算</th>
                            <th class="p-3 rounded-r-lg text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- 動的生成 -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center py-12 text-slate-400 text-sm hidden">
                保存されたデータはまだありません。上のフォームから計算を実行してください。
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-slate-900 text-slate-400 py-8 px-4 text-xs text-center mt-12">
        <p>&copy; 2026 Venture Factory. All rights reserved.</p>
    </footer>

    <script>
        let records = [];

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('kitchencar_records');
            if (saved) {
                try {
                    records = JSON.parse(saved);
                } catch (e) {
                    records = [];
                }
            }
            renderTable();
        });

        function saveData() {
            localStorage.setItem('kitchencar_records', JSON.stringify(records));
        }

        function loadSampleData() {
            document.getElementById('inputDate').value = '5/3 臨港パークイベント';
            document.getElementById('inputVisitors').value = '250';
            document.getElementById('inputWeather').value = '1.0';
            document.getElementById('inputPrice').value = '900';
        }

        function handleSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const visitors = parseInt(document.getElementById('inputVisitors').value);
            const weather = parseFloat(document.getElementById('inputWeather').value);
            const price = parseInt(document.getElementById('inputPrice').value);

            const expectedSales = Math.round(visitors * weather * price);
            const recommendedBudget = Math.round(expectedSales * 0.32);

            const newItem = {
                id: Date.now(),
                date,
                visitors,
                weather,
                expectedSales,
                recommendedBudget
            };

            records.unshift(newItem);
            saveData();
            renderTable();
            document.getElementById('calcForm').reset();
        }

        function deleteItem(id) {
            records = records.filter(item => item.id !== id);
            saveData();
            renderTable();
        }

        function clearData() {
            if (confirm('すべての履歴データを削除してもよろしいですか？')) {
                records = [];
                saveData();
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (records.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            records.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-slate-50 transition';
                
                let weatherText = '晴れ';
                if (item.weather === 0.8) weatherText = '曇り';
                if (item.weather === 0.6) weatherText = '雨天';

                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-800">${escapeHtml(item.date)}</td>
                    <td class="p-3">${item.visitors}人</td>
                    <td class="p-3">${weatherText} (${item.weather})</td>
                    <td class="p-3 font-semibold text-slate-700">${item.expectedSales.toLocaleString()}円</td>
                    <td class="p-3 font-bold text-orange-600">${item.recommendedBudget.toLocaleString()}円</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-rose-600 transition p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            if (records.length === 0) {
                alert('エクスポートするデータがありません。');
                return;
            }

            let csv = '\uFEFF出店日・名称,来客数,天候係数,予測売上(円),推奨仕入予算(円)\n';
            records.forEach(item => {
                csv += `"${item.date}",${item.visitors},${item.weather},${item.expectedSales},${item.recommendedBudget}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kitchencar_optimization_history.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('専用URLをコピーしました。お気に入りに登録して次回以降もご利用ください。');
            }).catch(() => {
                prompt('以下のURLをコピーしてください:', window.location.href);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
