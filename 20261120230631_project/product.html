    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完全版】キッチンカー専用 出店場所別・仕入原価最適シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <!-- 重要注意バー -->
    <div class="bg-amber-500 text-slate-950 px-4 py-3 text-xs md:text-sm font-bold text-center flex flex-col sm:flex-row justify-center items-center gap-2">
        <span>【重要】次回以降もこの完全版を利用するため、必ずこのページをブックマークするか専用URLをコピーして保管してください。</span>
        <button onclick="copyUrl()" class="bg-slate-900 text-white px-3 py-1 rounded text-xs hover:bg-slate-800 transition">
            <i class="fa-solid fa-copy"></i> 現在の専用URLをコピー
        </button>
    </div>

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 flex justify-between items-center">
        <div class="font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-truck-fast text-amber-500"></i> キッチンカー仕入シミュレーター <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded">完全版</span>
        </div>
        <div class="text-xs text-slate-500">Venture Factory (2026)</div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-5xl mx-auto py-10 px-6">
        
        <!-- 入力フォームカード -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-bold mb-4 text-slate-900"><i class="fa-solid fa-sliders text-amber-500"></i> 出店条件の入力</h2>
            <form id="simForm" onsubmit="event.preventDefault(); addRecord();" class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">出店先名 / イベント名</label>
                    <input type="text" id="spotName" required placeholder="例: 〇〇公園マルシェ" class="w-full border border-slate-300 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">予想来場者数 (人)</label>
                    <input type="number" id="visitors" required value="150" class="w-full border border-slate-300 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">平均客単価 (円)</label>
                    <input type="number" id="price" required value="800" class="w-full border border-slate-300 rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">天候係数</label>
                    <select id="weather" class="w-full border border-slate-300 rounded p-2 text-sm">
                        <option value="1.2">晴れ (1.2倍)</option>
                        <option value="1.0" selected>曇り (1.0倍)</option>
                        <option value="0.7">雨 (0.7倍)</option>
                    </select>
                </div>
                <div class="md:col-span-2 lg:col-span-4 flex justify-end gap-3 mt-2">
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow text-sm transition">
                        <i class="fa-solid fa-plus"></i> 計算して履歴に追加
                    </button>
                </div>
            </form>
        </div>

        <!-- 履歴・管理セクション -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-list-check text-amber-500"></i> シミュレーション履歴一覧</h2>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">
                        <i class="fa-solid fa-download"></i> CSV出力 (BOM付UTF-8)
                    </button>
                    <button onclick="clearAllData()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-3 py-2 rounded-lg transition">
                        全削除
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-500 bg-slate-50">
                            <th class="p-3">出店先</th>
                            <th class="p-3">調整後来客</th>
                            <th class="p-3">推奨仕入量(g)</th>
                            <th class="p-3">予想売上</th>
                            <th class="p-3">予想限界利益</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody">
                        <!-- JavaScriptで動的挿入 -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="text-center py-12 text-slate-400 text-sm hidden">
                履歴がありません。上のフォームからシミュレーションを追加してください。
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="bg-white border-t border-slate-200 py-6 px-6 text-center text-xs text-slate-500 mt-12">
        &copy; 2026 Venture Factory. All rights reserved.
    </footer>

    <script>
        let records = [];

        // 初期ロード
        window.onload = function() {
            const saved = localStorage.getItem('kitchencar_sim_records');
            if (saved) {
                try {
                    records = JSON.parse(saved);
                } catch (e) {
                    records = [];
                }
            }
            renderTable();
        };

        function saveData() {
            localStorage.setItem('kitchencar_sim_records', JSON.stringify(records));
        }

        function addRecord() {
            const name = document.getElementById('spotName').value;
            const visitors = parseFloat(document.getElementById('visitors').value);
            const price = parseFloat(document.getElementById('price').value);
            const weather = parseFloat(document.getElementById('weather').value);

            const adjustedVisitors = Math.round(visitors * weather);
            const totalGram = Math.round(adjustedVisitors * 120);
            const totalSales = adjustedVisitors * price;
            const totalProfit = Math.round(totalSales * 0.6);

            const newRecord = {
                id: Date.now(),
                name,
                adjustedVisitors,
                totalGram,
                totalSales,
                totalProfit
            };

            records.unshift(newRecord);
            saveData();
            renderTable();
            document.getElementById('simForm').reset();
            document.getElementById('visitors').value = 150;
            document.getElementById('price').value = 800;
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveData();
            renderTable();
        }

        function clearAllData() {
            if (confirm('すべての履歴を削除しますか？')) {
                records = [];
                saveData();
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('recordTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (records.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            records.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 text-sm hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-slate-900">${escapeHtml(r.name)}</td>
                    <td class="p-3">${r.adjustedVisitors.toLocaleString()} 人</td>
                    <td class="p-3 font-bold text-amber-600">${r.totalGram.toLocaleString()} g</td>
                    <td class="p-3">¥${r.totalSales.toLocaleString()}</td>
                    <td class="p-3 font-bold text-emerald-600">¥${r.totalProfit.toLocaleString()}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteRecord(${r.id})" class="text-slate-400 hover:text-rose-600 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            if (records.length === 0) {
                alert('出力するデータがありません。');
                return;
            }

            let csv = '\uFEFF'; // BOM
            csv += '出店先,調整後来客数(人),推奨仕入量(g),予想売上(円),予想限界利益(円)\n';

            records.forEach(r => {
                csv += `"${r.name}",${r.adjustedVisitors},${r.totalGram},${r.totalSales},${r.totalProfit}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kitchencar_simulation_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('専用URLをコピーしました！ブックマークと合わせて大切に保管してください。');
            }).catch(err => {
                alert('コピーに失敗しました。アドレスバーからURLを手動でコピーしてください。');
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
